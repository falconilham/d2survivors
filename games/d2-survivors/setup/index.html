<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Only our own files: nothing here may reach the network. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'" />
    <title>D2 Survivors</title>
    <link rel="stylesheet" href="setup.css" />
    <script type="module" src="setup.js"></script>
  </head>
  <body>
    <!-- The ember look (ember.ts): our own art only, until D2's front end has been read from the player's install.
         The D2 look then draws over all of it, on the game's front-end canvas. -->
    <canvas id="embers"></canvas>
    <div class="stage">
      <main>
        <header>
          <img class="icon" src="icon-512.png" alt="" />
          <h1 class="wordmark">D2 Survivors</h1>
        </header>
        <section class="page" aria-live="polite">
          <h2 id="heading"></h2>
          <div id="lines"></div>
          <div id="progress" hidden>
            <div class="track"><div id="fill"></div></div>
            <p id="caption"></p>
          </div>
          <div id="actions"></div>
        </section>
        <p class="legal">Unofficial fan project, not affiliated with Blizzard Entertainment. Diablo II® is a trademark of Blizzard Entertainment, Inc.</p>
      </main>
    </div>
  </body>
</html>
